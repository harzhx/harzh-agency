<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121629" />
      <stop offset="50%" stop-color="#0d1020" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>

    <!-- Interior Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#818cf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#neonGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glowGrad)" />

  <!-- The Bespoke Harzh 'H' Monogram with Fast-Forward Play Prism -->
  <g transform="translate(112, 104) scale(9.0)">
    <!-- Left Vertical Pillar -->
    <path d="M7 6.5C7 5.67157 7.67157 5 8.5 5H10.5C11.3284 5 12 5.67157 12 6.5V25.5C12 26.3284 11.3284 27 10.5 27H8.5C7.67157 27 7 26.3284 7 25.5V6.5Z" fill="#FFFFFF" />

    <!-- Right Vertical Pillar -->
    <path d="M20 6.5C20 5.67157 20.6716 5 21.5 5H23.5C24.3284 5 25 5.67157 25 6.5V25.5C25 26.3284 24.3284 27 23.5 27H21.5C20.6716 27 20 26.3284 20 25.5V6.5Z" fill="#FFFFFF" />

    <!-- Central Connecting Dynamic Fast-Forward Play Crossbar -->
    <path d="M12 13.5L19 16L12 18.5V13.5Z" fill="#818CF8" />
    <path d="M11 15H21V17H11V15Z" fill="#818CF8" fill-opacity="0.75" />

    <!-- Subtle Film Track Notches -->
    <circle cx="9.5" cy="8.5" r="0.9" fill="#818CF8" />
    <circle cx="22.5" cy="8.5" r="0.9" fill="#818CF8" />
    <circle cx="9.5" cy="23.5" r="0.9" fill="#818CF8" />
    <circle cx="22.5" cy="23.5" r="0.9" fill="#818CF8" />
  </g>
</svg>
