<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121629" />
      <stop offset="50%" stop-color="#0d1020" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="3" />
    
    <!-- Monogram inside Icon -->
    <g transform="translate(38, 36) scale(3.9)">
      <path d="M7 6.5C7 5.67157 7.67157 5 8.5 5H10.5C11.3284 5 12 5.67157 12 6.5V25.5C12 26.3284 11.3284 27 10.5 27H8.5C7.67157 27 7 26.3284 7 25.5V6.5Z" fill="#FFFFFF" />
      <path d="M20 6.5C20 5.67157 20.6716 5 21.5 5H23.5C24.3284 5 25 5.67157 25 6.5V25.5C25 26.3284 24.3284 27 23.5 27H21.5C20.6716 27 20 26.3284 20 25.5V6.5Z" fill="#FFFFFF" />
      <path d="M12 13.5L19 16L12 18.5V13.5Z" fill="#818CF8" />
      <path d="M11 15H21V17H11V15Z" fill="#818CF8" fill-opacity="0.75" />
      <circle cx="9.5" cy="8.5" r="0.9" fill="#818CF8" />
      <circle cx="22.5" cy="8.5" r="0.9" fill="#818CF8" />
      <circle cx="9.5" cy="23.5" r="0.9" fill="#818CF8" />
      <circle cx="22.5" cy="23.5" r="0.9" fill="#818CF8" />
    </g>
  </g>

  <!-- Right Typography Wordmark "HARZH" -->
  <text x="300" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="900" letter-spacing="-2" fill="#FFFFFF">
    HARZH
  </text>

  <!-- Glowing Indigo Dot -->
  <circle cx="770" cy="170" r="12" fill="#818CF8" filter="url(#textGlow)" />
  <circle cx="770" cy="170" r="6" fill="#FFFFFF" />
</svg>
